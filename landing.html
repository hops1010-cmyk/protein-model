<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Lab | Entrance</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-color: #4facfe;
            --text-main: #ffffff;
            --text-dim: #8a99ad;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }
        #hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(5, 7, 10, 0.7), rgba(5, 7, 10, 0.7)), 
                        url('https://images.unsplash.com/photo-1532187875605-26573a79778c?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            z-index: 1;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 40px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .enter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 100px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(10px);
        }
        .enter-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: scale(1.05);
        }
        .fade-in {
            animation: fadeIn 2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>
    <div id="hero-bg"></div>
    <div id="content" class="fade-in">
        <h1>MOLECULAR LAB</h1>
        <p>GSAP & Three.js Visualization Suite</p>
        <a href="index.html" class="enter-btn">ENTER EXPERIENCE</a>
    </div>
    <script>
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.getElementById('hero-bg').style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body>
</html>
