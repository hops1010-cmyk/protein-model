<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Lab | Animation Showcase</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-color: #4facfe;
            --accent-glow: rgba(79, 172, 254, 0.4);
            --text-main: #ffffff;
            --text-dim: #8a99ad;
            --glass: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 2;
        }

        #ui-overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            max-width: 400px;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            transition: opacity 0.3s ease;
        }

        p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-dim);
            transition: opacity 0.3s ease;
        }

        #player-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            transform: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: auto;
            max-width: 90vw;
        }

        .control-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 16px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.1s linear;
        }

        button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 8px;
            cursor: pointer;
            font-size: 10pt;
            transition: all 0.2s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
        }

        .slide-counter {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: monospace;
            min-width: 60px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(79, 172, 254, 0.2);
            color: var(--accent-color);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <div id="vignette"></div>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="glass-panel" id="info-panel">
            <div class="badge">Animation Slide</div>
            <h1 id="mode-title">Loading...</h1>
            <p id="mode-desc">Please wait while the suite initializes.</p>
        </div>
    </div>

    <div id="player-controls">
        
        </div>
        <div class="control-bar">
            <button onclick="player.prev()" title="Previous">«</button>
            <button onclick="player.togglePlay()" id="play-pause" title="Play/Pause">⏸</button>
            <button onclick="player.next()" title="Next">»</button>
            <div class="slide-counter" id="slide-num">1 / 22</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070a, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x334155, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x4facfe, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let currentContent = null;
        let activeTimeline = null;

        function clearScene() {
            if (activeTimeline) activeTimeline.kill();
            const toRemove = [];
            scene.traverse(child => {
                if (child !== scene && child !== ambientLight && child !== dirLight) {
                    toRemove.push(child);
                }
            });
            toRemove.forEach(child => scene.remove(child));
            camera.position.set(0, 0, 0);
        }

        const modules = {
            protein: {
                title: "Protein Model", desc: "Dynamic GSAP Animation Sequencing",
                fn: () => {
                    const colors = { carbon: 0x2d3748, oxygen: 0xef4444, nitrogen: 0x3b82f6, hydrogen: 0xf8fafc, activeSite: 0xf59e0b };
                    const moleculeGroup = new THREE.Group();
                    const atoms = [], atomPositions = [];
                    const atomGeometry = new THREE.SphereGeometry(0.6, 32, 32), bondGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
                    for (let i = 0; i < 80; i++) {
                        const t = i * 0.4;
                        const pos = new THREE.Vector3(Math.sin(t)*5 + Math.cos(t*2)*2, t*0.6-8, Math.cos(t)*5 + Math.sin(t*1.5)*2);
                        atomPositions.push(pos);
                        let atomColor = colors.carbon, isBindingSite = (i > 35 && i < 45);
                        if (isBindingSite) atomColor = colors.activeSite;
                        else if (i !== 0 && i % 3 === 0) atomColor = colors.oxygen;
                        else if (i !== 0 && i % 5 === 0) atomColor = colors.nitrogen;
                        else if (i % 2 === 0) atomColor = colors.hydrogen;
                        const atomMesh = new THREE.Mesh(atomGeometry, new THREE.MeshStandardMaterial({ color: atomColor, roughness: 0.2, metalness: 0.1 }));
                        atomMesh.position.copy(pos);
                        const baseScale = isBindingSite ? 1.2 : (atomColor === colors.hydrogen ? 0.6 : 1.0);
                        atomMesh.scale.set(baseScale, baseScale, baseScale);
                        moleculeGroup.add(atomMesh);
                        atoms.push({ mesh: atomMesh, baseScale, isBindingSite });
                    }
                    for (let i = 0; i < atomPositions.length; i++) {
                        const connections = [i + 1];
                        if (i % 8 === 0 && i + 12 < atomPositions.length) connections.push(i + 12);
                        connections.forEach(targetIdx => {
                            if (targetIdx >= atomPositions.length) return;
                            const pA = atomPositions[i], pB = atomPositions[targetIdx];
                            if (pA.distanceTo(pB) < 7) {
                                const bondMesh = new THREE.Mesh(bondGeometry, new THREE.MeshStandardMaterial({ color: 0x64748b }));
                                const dir = new THREE.Vector3().subVectors(pB, pA);
                                bondMesh.scale.set(1, dir.length(), 1);
                                bondMesh.position.copy(pA).add(dir.clone().multiplyScalar(0.5));
                                bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                                moleculeGroup.add(bondMesh);
                            }
                        });
                    }
                    scene.add(moleculeGroup);
                    moleculeGroup.scale.set(0.7, 0.7, 0.7); // Scale down slightly
                    camera.position.set(20, 15, 35);
                    activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
                    activeTimeline.to(camera.position, { x: 0, y: 2, z: 22, duration: 4, ease: "power2.inOut" });
                    atoms.forEach(atom => {
                        if (atom.isBindingSite) activeTimeline.to(atom.mesh.scale, { x: atom.baseScale * 1.8, y: atom.baseScale * 1.8, z: atom.baseScale * 1.8, duration: 2, ease: "elastic.out(1, 0.5)" }, "-=1.5");
                    });
                    activeTimeline.to(moleculeGroup.rotation, { x: Math.PI * 0.5, y: Math.PI * 2, duration: 6, ease: "sine.inOut" }, "-=0.5");
                    return { update: (time) => {
                        moleculeGroup.rotation.y += 0.003;
                        atoms.forEach((atom, idx) => atom.mesh.position.y = atomPositions[idx].y + Math.sin(time * 2 + idx * 0.5) * 0.15);
                        camera.lookAt(0, 0, 0);
                    }};
                }
            },
            hover: {
                title: "Hover Interaction", desc: "Algorithm: Elastic Scale + Power2 Rotation",
                fn: () => {
                    const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                    scene.add(cube);
                    camera.position.set(0, 0, 3);
                    const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
                    let wasHovered = false;
                    window.addEventListener('mousemove', (e) => {
                        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObject(cube);
                        const isHovered = intersects.length > 0;
                        if (isHovered !== wasHovered) {
                            gsap.to(cube.scale, { x: isHovered ? 1.5 : 1, y: isHovered ? 1.5 : 1, z: isHovered ? 1.5 : 1, duration: 1.2, ease: "elastic.out(1, 0.3)", overwrite: "auto" });
                            gsap.to(cube.rotation, { x: isHovered ? Math.PI : 0, y: isHovered ? Math.PI / 2 : 0, duration: 1, ease: "power2.out" });
                            wasHovered = isHovered;
                        }
                    });
                    return { update: () => camera.lookAt(0, 0, 0) };
                }
            },
            wave: {
                title: "Grid Wave", desc: "Algorithm: 2D Grid Stagger (From Center)",
                fn: () => {
                    const rows = 10, cols = 10, meshes = [];
                    for (let x = 0; x < cols; x++) {
                        for (let z = 0; z < rows; z++) {
                            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshNormalMaterial());
                            mesh.position.set(x * 1.5 - (cols * 1.5) / 2, 0, z * 1.5 - (rows * 1.5) / 2);
                            scene.add(mesh);
                            meshes.push(mesh);
                        }
                    }
                    camera.position.set(10, 12, 15);
                    activeTimeline = gsap.to(meshes.map(m => m.position), { y: 3, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut", stagger: { amount: 1.5, grid: [cols, rows], from: "center" } });
                    return { update: () => camera.lookAt(0, 0, 0) };
                }
            },
            matrix: {
                title: "Sphere Matrix", desc: "Algorithm: Radial Pulse & Scale Stagger",
                fn: () => {
                    const rows = 10, cols = 10, spheres = [];
                    for (let x = 0; x < cols; x++) {
                        for (let z = 0; z < rows; z++) {
                            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshNormalMaterial());
                            sphere.position.set(x * 1.2 - (cols * 1.2) / 2, 0, z * 1.2 - (rows * 1.2) / 2);
                            scene.add(sphere);
                            spheres.push(sphere);
                        }
                    }
                    camera.position.set(10, 10, 10);
                    activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
                    activeTimeline.to(spheres.map(s => s.scale), { x: 2, y: 2, z: 2, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
                    activeTimeline.to(spheres.map(s => s.position), { y: 1, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
                    return { update: () => camera.lookAt(0, 0, 0) };
                }
            },
            drift: {
                title: "Lattice Drift", desc: "Harmonic Oscillation of Icosahedrons",
                fn: () => {
                    const points = [];
                    for(let i=0; i<50; i++) {
                        const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2), new THREE.MeshNormalMaterial());
                        mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                        scene.add(mesh);
                        points.push(mesh);
                    }
                    camera.position.set(0, 0, 15);
                    return { update: (t) => {
                        points.forEach((p, i) => { p.position.y += Math.sin(t + i) * 0.01; p.rotation.x += 0.01; });
                        camera.lookAt(0,0,0);
                    }};
                }
            },
            burst: {
                title: "Radial Burst", desc: "Center-out Staggered Expansion",
                fn: () => {
                    const spheres = [];
                    for(let i=0; i<100; i++) {
                        const s = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshNormalMaterial());
                        scene.add(s);
                        spheres.push(s);
                    }
                    camera.position.set(0, 0, 10);
                    activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
                    activeTimeline.to(spheres.map(s => s.position), {
                        x: () => (Math.random()-0.5)*15, y: () => (Math.random()-0.5)*15, z: () => (Math.random()-0.5)*15,
                        duration: 2, stagger: 0.01, ease: "power2.out"
                    });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            shatter: {
                title: "Shatter", desc: "Fragmented Geometry Dispersion",
                fn: () => {
                    const group = new THREE.Group(), fragments = [];
                    for(let i=0; i<27; i++) {
                        const f = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshNormalMaterial());
                        f.position.set((i%3)-1, Math.floor(i/9)-1, Math.floor((i%9)/3)-1);
                        group.add(f);
                        fragments.push(f);
                    }
                    scene.add(group);
                    camera.position.set(5, 5, 5);
                    activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
                    activeTimeline.to(fragments.map(f => f.position), {
                        x: (i, target) => target.x * 5, y: (i, target) => target.y * 5, z: (i, target) => target.z * 5,
                        duration: 1.5, stagger: 0.05, ease: "back.in"
                    });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            filling: {
                title: "Liquid Fill", desc: "Linear Volume Interpolation",
                fn: () => {
                    const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 3, 32), new THREE.MeshStandardMaterial({ color: 0x4facfe, transparent: true, opacity: 0.6 }));
                    const water = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 3, 32), new THREE.MeshStandardMaterial({ color: 0x00f2fe }));
                    water.position.y = -3;
                    scene.add(cylinder, water);
                    camera.position.set(0, 2, 5);
                    activeTimeline = gsap.to(water.position, { y: 0, duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut" });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            tether: {
                title: "Elastic Tether", desc: "Elastic In-Out Snap Algorithm",
                fn: () => {
                    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshNormalMaterial());
                    scene.add(sphere);
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.to(sphere.position, { x: 2, y: 2, z: 0, duration: 1, repeat: -1, yoyo: true, ease: "elastic.inOut(1, 0.3)" });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            orbital: {
                title: "Orbital Rings", desc: "Concentric Rotation Speeds",
                fn: () => {
                    const rings = [];
                    for(let i=1; i<=3; i++) {
                        const ring = new THREE.Mesh(new THREE.TorusGeometry(i*2, 0.05, 16, 100), new THREE.MeshBasicMaterial({ color: 0x4facfe }));
                        ring.rotation.x = Math.PI/2;
                        scene.add(ring);
                        rings.push(ring);
                    }
                    camera.position.set(5, 10, 5);
                    return { update: (t) => {
                        rings.forEach((r, i) => r.rotation.z += 0.01 * (i+1));
                        camera.lookAt(0,0,0);
                    }};
                }
            },
            pulse: {
                title: "Neon Pulse", desc: "Emissive Scale Synchronization",
                fn: () => {
                    const core = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({ color: 0x4facfe, emissive: 0x4facfe }));
                    scene.add(core);
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.to(core.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 0.8, repeat: -1, yoyo: true, ease: "sine.inOut" });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            unfold: {
                title: "Cubic Unfold", desc: "Rotationally Driven Expansion",
                fn: () => {
                    const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshNormalMaterial());
                    scene.add(cube);
                    camera.position.set(3,3,3);
                    activeTimeline = gsap.to(cube.rotation, { x: Math.PI, duration: 2, repeat: -1, yoyo: true });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            twist: {
                title: "Torus Twist", desc: "Knot-Axis Torque Animation",
                fn: () => {
                    const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.3, 100, 16), new THREE.MeshNormalMaterial());
                    scene.add(torus);
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.to(torus.rotation, { x: Math.PI*2, y: Math.PI, duration: 4, repeat: -1, ease: "none" });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            vortex: {
                title: "Vortex", desc: "Spiral Convergence Matrix",
                fn: () => {
                    const dots = [];
                    for(let i=0; i<200; i++) {
                        const d = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                        scene.add(d);
                        dots.push(d);
                    }
                    camera.position.set(0, 10, 10);
                    return { update: (t) => {
                        dots.forEach((d, i) => {
                            const angle = t * 0.5 + i * 0.1, dist = (i/200) * 5;
                            d.position.set(Math.cos(angle)*dist, - (i/200)*5, Math.sin(angle)*dist);
                        });
                        camera.lookAt(0,0,0);
                    }};
                }
            },
            quantum: {
                title: "Quantum Leap", desc: "Randomized Position Teleportation",
                fn: () => {
                    const q = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshNormalMaterial());
                    scene.add(q);
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.to(q.position, {
                        x: () => (Math.random()-0.5)*4, y: () => (Math.random()-0.5)*4, z: () => (Math.random()-0.5)*4,
                        duration: 0.5, repeat: -1, ease: "power4.inOut"
                    });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            ribbon: {
                title: "Sine Ribbon", desc: "Wave-form PathFollowing",
                fn: () => {
                    const spheres = [];
                    for(let i=0; i<30; i++) {
                        const s = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshNormalMaterial());
                        scene.add(s);
                        spheres.push(s);
                    }
                    camera.position.set(0, 5, 10);
                    return { update: (t) => {
                        spheres.forEach((s, i) => {
                            s.position.x = (i - 15) * 0.4;
                            s.position.y = Math.sin(t * 2 + i * 0.3) * 2;
                            s.position.z = Math.cos(t * 2 + i * 0.3) * 2;
                        });
                        camera.lookAt(0,0,0);
                    }};
                }
            },
            core: {
                title: "Pulsing Core", desc: "Elastic Scale-Pulse Center",
                fn: () => {
                    const core = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055 }));
                    scene.add(core);
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.to(core.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 0.5, repeat: -1, yoyo: true, ease: "elastic.out(1, 0.3)" });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            gravity: {
                title: "Gravity Well", desc: "Centralized Attraction Vector",
                fn: () => {
                    const particles = [];
                    for(let i=0; i<100; i++) {
                        const p = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0x4facfe }));
                        p.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                        scene.add(p);
                        particles.push(p);
                    }
                    camera.position.set(0,0,15);
                    activeTimeline = gsap.to(particles.map(p => p.position), {
                        x: 0, y: 0, z: 0, duration: 2, repeat: -1, yoyo: true, ease: "power4.in"
                    });
                    return { update: () => camera.lookAt(0,0,0) };
                }
            },
            prism: {
                title: "Prism Split", desc: "Trigonometric Geometry Splitting",
                fn: () => {
                    const prisms = [];
                    const colors = [0x4facfe, 0x00f2fe, 0xff0055];
                    for(let i=0; i<3; i++) {
                        const p = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), new THREE.MeshStandardMaterial({ color: colors[i] }));
                        p.position.set(0,0,0);
                        scene.add(p);
                        prisms.push(p);
                    }
                    camera.position.set(0,0,5);
                    activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
                    activeTimeline.to(prisms[0].position, { x: -1, duration: 1 });
                    activeTimeline.to(prisms[1].position, { x: 1, duration: 1 }, "<");
                    activeTimeline.to(prisms[2].position, { y: 1, duration: 1 }, "<");
                    return { update: () => camera.lookAt(0,0,0) };
                }
            }
        };

        const slideKeys = Object.keys(modules);

        function setMode(mode) {
            clearScene();
            const config = modules[mode];
            
            gsap.to(['#mode-title', '#mode-desc'], { opacity: 0, y: -10, duration: 0.2, onComplete: () => {
                document.getElementById('mode-title').innerText = config.title;
                document.getElementById('mode-desc').innerText = config.desc;
                currentContent = config.fn();
                gsap.to(['#mode-title', '#mode-desc'], { opacity: 1, y: 0, duration: 0.3 });
            }});
        }

        const player = {
            currentIdx: 0,
            isPlaying: true,
            slideDuration: 10000,
            startTime: 0,
            init() {
                this.startTime = Date.now();
                this.updateSlide();
            },
            updateSlide() {
                const mode = slideKeys[this.currentIdx];
                setMode(mode);
                document.getElementById('slide-num').innerText = `${this.currentIdx + 1} / ${slideKeys.length}`;
                this.startTime = Date.now();
            },
            next() {
                this.currentIdx = (this.currentIdx + 1) % slideKeys.length;
                this.updateSlide();
            },
            prev() {
                this.currentIdx = (this.currentIdx - 1 + slideKeys.length) % slideKeys.length;
                this.updateSlide();
            },
            togglePlay() {
                this.isPlaying = !this.isPlaying;
                document.getElementById('play-pause').innerText = this.isPlaying ? "⏸" : "▶";
            },
            tick() {
                if (!this.isPlaying) return;
                const elapsed = Date.now() - this.startTime;
                const progress = Math.min((elapsed / this.slideDuration) * 100, 100);
                document.getElementById('progress-bar').style.width = progress + "%";
                if (elapsed >= this.slideDuration) this.next();
            }
        };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            if (currentContent && currentContent.update) currentContent.update(time);
            player.tick();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        player.init();
        animate();
    </script>
</body>
</html>
