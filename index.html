<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Lab | 3D Visualization Suite</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-color: #4facfe;
            --accent-glow: rgba(79, 172, 254, 0.4);
            --text-main: #ffffff;
            --text-dim: #8a99ad;
            --glass: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 2;
        }

        #ui-overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            max-width: 400px;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            transition: opacity 0.3s ease;
        }

        p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-dim);
            transition: opacity 0.3s ease;
        }

        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 100px;
            pointer-events: auto;
            outline: none;
            white-space: nowrap;
        }

        button:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        button.active {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(79, 172, 254, 0.2);
            color: var(--accent-color);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <div id="vignette"></div>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="glass-panel" id="info-panel">
            <div class="badge">Algorithm Suite</div>
            <h1 id="mode-title">Protein Model</h1>
            <p id="mode-desc">Dynamic GSAP Animation Sequencing</p>
        </div>
    </div>

    <div id="controls">
        <button onclick="setMode('protein')" id="btn-protein" class="active">Protein</button>
        <button onclick="setMode('hover')" id="btn-hover">Hover Alg</button>
        <button onclick="setMode('wave')" id="btn-wave">Grid Wave</button>
        <button onclick="setMode('matrix')" id="btn-matrix">Sphere Matrix</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070a, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x334155, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x4facfe, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let currentContent = null;
        let activeTimeline = null;

        function clearScene() {
            if (activeTimeline) activeTimeline.kill();
            const toRemove = [];
            scene.traverse(child => {
                if (child !== scene && child !== ambientLight && child !== dirLight) {
                    toRemove.push(child);
                }
            });
            toRemove.forEach(child => scene.remove(child));
            camera.position.set(0, 0, 0);
        }

        function initProtein() {
            const colors = { carbon: 0x2d3748, oxygen: 0xef4444, nitrogen: 0x3b82f6, hydrogen: 0xf8fafc, activeSite: 0xf59e0b };
            const moleculeGroup = new THREE.Group();
            const atoms = [];
            const atomPositions = [];
            const atomGeometry = new THREE.SphereGeometry(0.6, 32, 32);
            const bondGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);

            for (let i = 0; i < 80; i++) {
                const t = i * 0.4;
                const pos = new THREE.Vector3(Math.sin(t)*5 + Math.cos(t*2)*2, t*0.6-8, Math.cos(t)*5 + Math.sin(t*1.5)*2);
                atomPositions.push(pos);
                let atomColor = colors.carbon;
                let isBindingSite = (i > 35 && i < 45);
                if (isBindingSite) atomColor = colors.activeSite;
                else if (i !== 0 && i % 3 === 0) atomColor = colors.oxygen;
                else if (i !== 0 && i % 5 === 0) atomColor = colors.nitrogen;
                else if (i % 2 === 0) atomColor = colors.hydrogen;

                const atomMesh = new THREE.Mesh(atomGeometry, new THREE.MeshStandardMaterial({ color: atomColor, roughness: 0.2, metalness: 0.1 }));
                atomMesh.position.copy(pos);
                const baseScale = isBindingSite ? 1.2 : (atomColor === colors.hydrogen ? 0.6 : 1.0);
                atomMesh.scale.set(baseScale, baseScale, baseScale);
                moleculeGroup.add(atomMesh);
                atoms.push({ mesh: atomMesh, baseScale, isBindingSite });
            }

            for (let i = 0; i < atomPositions.length; i++) {
                const connections = [i + 1];
                if (i % 8 === 0 && i + 12 < atomPositions.length) connections.push(i + 12);
                connections.forEach(targetIdx => {
                    if (targetIdx >= atomPositions.length) return;
                    const pA = atomPositions[i], pB = atomPositions[targetIdx];
                    if (pA.distanceTo(pB) < 7) {
                        const bondMesh = new THREE.Mesh(bondGeometry, new THREE.MeshStandardMaterial({ color: 0x64748b }));
                        const dir = new THREE.Vector3().subVectors(pB, pA);
                        bondMesh.scale.set(1, dir.length(), 1);
                        bondMesh.position.copy(pA).add(dir.clone().multiplyScalar(0.5));
                        bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                        moleculeGroup.add(bondMesh);
                    }
                });
            }
            scene.add(moleculeGroup);
            camera.position.set(20, 15, 35);

            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(camera.position, { x: 0, y: 2, z: 22, duration: 4, ease: "power2.inOut" });
            atoms.forEach(atom => {
                if (atom.isBindingSite) {
                    activeTimeline.to(atom.mesh.scale, { x: atom.baseScale * 1.8, y: atom.baseScale * 1.8, z: atom.baseScale * 1.8, duration: 2, ease: "elastic.out(1, 0.5)" }, "-=1.5");
                }
            });
            activeTimeline.to(moleculeGroup.rotation, { x: Math.PI * 0.5, y: Math.PI * 2, duration: 6, ease: "sine.inOut" }, "-=0.5");

            return {
                update: (time) => {
                    moleculeGroup.rotation.y += 0.003;
                    atoms.forEach((atom, idx) => {
                        atom.mesh.position.y = atomPositions[idx].y + Math.sin(time * 2 + idx * 0.5) * 0.15;
                    });
                    camera.lookAt(0, 0, 0);
                }
            };
        }

        function initHover() {
            const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
            scene.add(cube);
            camera.position.set(0, 0, 3);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let wasHovered = false;

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(cube);
                const isHovered = intersects.length > 0;
                if (isHovered !== wasHovered) {
                    gsap.to(cube.scale, { x: isHovered ? 1.5 : 1, y: isHovered ? 1.5 : 1, z: isHovered ? 1.5 : 1, duration: 1.2, ease: "elastic.out(1, 0.3)", overwrite: "auto" });
                    gsap.to(cube.rotation, { x: isHovered ? Math.PI : 0, y: isHovered ? Math.PI / 2 : 0, duration: 1, ease: "power2.out" });
                    wasHovered = isHovered;
                }
            });
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function initWave() {
            const rows = 10, cols = 10, meshes = [];
            for (let x = 0; x < cols; x++) {
                for (let z = 0; z < rows; z++) {
                    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshNormalMaterial());
                    mesh.position.set(x * 1.5 - (cols * 1.5) / 2, 0, z * 1.5 - (rows * 1.5) / 2);
                    scene.add(mesh);
                    meshes.push(mesh);
                }
            }
            camera.position.set(10, 12, 15);
            activeTimeline = gsap.to(meshes.map(m => m.position), {
                y: 3, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut",
                stagger: { amount: 1.5, grid: [cols, rows], from: "center" }
            });
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function initMatrix() {
            const rows = 10, cols = 10, spheres = [];
            for (let x = 0; x < cols; x++) {
                for (let z = 0; z < rows; z++) {
                    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshNormalMaterial());
                    sphere.position.set(x * 1.2 - (cols * 1.2) / 2, 0, z * 1.2 - (rows * 1.2) / 2);
                    scene.add(sphere);
                    spheres.push(sphere);
                }
            }
            camera.position.set(10, 10, 10);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(spheres.map(s => s.scale), { x: 2, y: 2, z: 2, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
            activeTimeline.to(spheres.map(s => s.position), { y: 1, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function setMode(mode) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');
            
            gsap.to(['#mode-title', '#mode-desc'], { opacity: 0, y: -10, duration: 0.2, onComplete: () => {
                const title = document.getElementById('mode-title');
                const desc = document.getElementById('mode-desc');
                
                if (mode === 'protein') {
                    title.innerText = "Protein Model";
                    desc.innerText = "Dynamic GSAP Animation Sequencing";
                    currentContent = initProtein();
                } else if (mode === 'hover') {
                    title.innerText = "Hover Interaction";
                    desc.innerText = "Algorithm: Elastic Scale + Power2 Rotation";
                    currentContent = initHover();
                } else if (mode === 'wave') {
                    title.innerText = "Grid Wave";
                    desc.innerText = "Algorithm: 2D Grid Stagger (From Center)";
                    currentContent = initWave();
                } else if (mode === 'matrix') {
                    title.innerText = "Sphere Matrix";
                    desc.innerText = "Algorithm: Radial Pulse & Scale Stagger";
                    currentContent = initMatrix();
                }
                
                gsap.to(['#mode-title', '#mode-desc'], { opacity: 1, y: 0, duration: 0.3 });
            }});

            clearScene();
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            if (currentContent && currentContent.update) currentContent.update(time);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setMode('protein');
        animate();
    </script>
</body>
</html>
