<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Lab | GSAP & Three.js Master Suite</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-color: #4facfe;
            --accent-glow: rgba(79, 172, 254, 0.4);
            --text-main: #ffffff;
            --text-dim: #8a99ad;
            --glass: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 2;
        }

        #ui-overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            max-width: 400px;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            transition: opacity 0.3s ease;
        }

        p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-dim);
            transition: opacity 0.3s ease;
        }

        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #controls::-webkit-scrollbar { display: none; }

        button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 100px;
            pointer-events: auto;
            outline: none;
            white-space: nowrap;
        }

        button:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        button.active {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(79, 172, 254, 0.2);
            color: var(--accent-color);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <div id="vignette"></div>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="glass-panel" id="info-panel">
            <div class="badge">Algorithm Suite</div>
            <h1 id="mode-title">Protein Model</h1>
            <p id="mode-desc">Dynamic GSAP Animation Sequencing</p>
        </div>
    </div>

    <div id="controls">
        <button onclick="setMode('protein')" id="btn-protein" class="active">Protein</button>
        <button onclick="setMode('hover')" id="btn-hover">Hover Alg</button>
        <button onclick="setMode('wave')" id="btn-wave">Grid Wave</button>
        <button onclick="setMode('matrix')" id="btn-matrix">Sphere Matrix</button>
        <button onclick="setMode('drift')" id="btn-drift">Lattice Drift</button>
        <button onclick="setMode('burst')" id="btn-burst">Radial Burst</button>
        <button onclick="setMode('shatter')" id="btn-shatter">Shatter</button>
        <button onclick="setMode('filling')" id="btn-filling">Liquid Fill</button>
        <button onclick="setMode('tether')" id="btn-tether">Elastic Tether</button>
        <button onclick="setMode('orbital')" id="btn-orbital">Orbital Rings</button>
        <button onclick="setMode('pulse')" id="btn-pulse">Neon Pulse</button>
        <button onclick="setMode('unfold')" id="btn-unfold">Cubic Unfold</button>
        <button onclick="setMode('twist')" id="btn-twist">Torus Twist</button>
        <button onclick="setMode('vortex')" id="btn-vortex">Vortex</button>
        <button onclick="setMode('quantum')" id="btn-quantum">Quantum Leap</button>
        <button onclick="setMode('ribbon')" id="btn-ribbon">Sine Ribbon</button>
        <button onclick="setMode('core')" id="btn-core">Pulsing Core</button>
        <button onclick="setMode('gravity')" id="btn-gravity">Gravity Well</button>
        <button onclick="setMode('prism')" id="btn-prism">Prism Split</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070a, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x334155, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x4facfe, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let currentContent = null;
        let activeTimeline = null;

        function clearScene() {
            if (activeTimeline) activeTimeline.kill();
            const toRemove = [];
            scene.traverse(child => {
                if (child !== scene && child !== ambientLight && child !== dirLight) {
                    toRemove.push(child);
                }
            });
            toRemove.forEach(child => scene.remove(child));
            camera.position.set(0, 0, 0);
        }

        function initProtein() {
            const colors = { carbon: 0x2d3748, oxygen: 0xef4444, nitrogen: 0x3b82f6, hydrogen: 0xf8fafc, activeSite: 0xf59e0b };
            const moleculeGroup = new THREE.Group();
            const atoms = [];
            const atomPositions = [];
            const atomGeometry = new THREE.SphereGeometry(0.6, 32, 32);
            const bondGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
            for (let i = 0; i < 80; i++) {
                const t = i * 0.4;
                const pos = new THREE.Vector3(Math.sin(t)*5 + Math.cos(t*2)*2, t*0.6-8, Math.cos(t)*5 + Math.sin(t*1.5)*2);
                atomPositions.push(pos);
                let atomColor = colors.carbon;
                let isBindingSite = (i > 35 && i < 45);
                if (isBindingSite) atomColor = colors.activeSite;
                else if (i !== 0 && i % 3 === 0) atomColor = colors.oxygen;
                else if (i !== 0 && i % 5 === 0) atomColor = colors.nitrogen;
                else if (i % 2 === 0) atomColor = colors.hydrogen;
                const atomMesh = new THREE.Mesh(atomGeometry, new THREE.MeshStandardMaterial({ color: atomColor, roughness: 0.2, metalness: 0.1 }));
                atomMesh.position.copy(pos);
                const baseScale = isBindingSite ? 1.2 : (atomColor === colors.hydrogen ? 0.6 : 1.0);
                atomMesh.scale.set(baseScale, baseScale, baseScale);
                moleculeGroup.add(atomMesh);
                atoms.push({ mesh: atomMesh, baseScale, isBindingSite });
            }
            for (let i = 0; i < atomPositions.length; i++) {
                const connections = [i + 1];
                if (i % 8 === 0 && i + 12 < atomPositions.length) connections.push(i + 12);
                connections.forEach(targetIdx => {
                    if (targetIdx >= atomPositions.length) return;
                    const pA = atomPositions[i], pB = atomPositions[targetIdx];
                    if (pA.distanceTo(pB) < 7) {
                        const bondMesh = new THREE.Mesh(bondGeometry, new THREE.MeshStandardMaterial({ color: 0x64748b }));
                        const dir = new THREE.Vector3().subVectors(pB, pA);
                        bondMesh.scale.set(1, dir.length(), 1);
                        bondMesh.position.copy(pA).add(dir.clone().multiplyScalar(0.5));
                        bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                        moleculeGroup.add(bondMesh);
                    }
                });
            }
            scene.add(moleculeGroup);
            camera.position.set(20, 15, 35);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(camera.position, { x: 0, y: 2, z: 22, duration: 4, ease: "power2.inOut" });
            atoms.forEach(atom => {
                if (atom.isBindingSite) {
                    activeTimeline.to(atom.mesh.scale, { x: atom.baseScale * 1.8, y: atom.baseScale * 1.8, z: atom.baseScale * 1.8, duration: 2, ease: "elastic.out(1, 0.5)" }, "-=1.5");
                }
            });
            activeTimeline.to(moleculeGroup.rotation, { x: Math.PI * 0.5, y: Math.PI * 2, duration: 6, ease: "sine.inOut" }, "-=0.5");
            return {
                update: (time) => {
                    moleculeGroup.rotation.y += 0.003;
                    atoms.forEach((atom, idx) => {
                        atom.mesh.position.y = atomPositions[idx].y + Math.sin(time * 2 + idx * 0.5) * 0.15;
                    });
                    camera.lookAt(0, 0, 0);
                }
            };
        }

        function initHover() {
            const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
            scene.add(cube);
            camera.position.set(0, 0, 3);
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let wasHovered = false;
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(cube);
                const isHovered = intersects.length > 0;
                if (isHovered !== wasHovered) {
                    gsap.to(cube.scale, { x: isHovered ? 1.5 : 1, y: isHovered ? 1.5 : 1, z: isHovered ? 1.5 : 1, duration: 1.2, ease: "elastic.out(1, 0.3)", overwrite: "auto" });
                    gsap.to(cube.rotation, { x: isHovered ? Math.PI : 0, y: isHovered ? Math.PI / 2 : 0, duration: 1, ease: "power2.out" });
                    wasHovered = isHovered;
                }
            });
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function initWave() {
            const rows = 10, cols = 10, meshes = [];
            for (let x = 0; x < cols; x++) {
                for (let z = 0; z < rows; z++) {
                    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshNormalMaterial());
                    mesh.position.set(x * 1.5 - (cols * 1.5) / 2, 0, z * 1.5 - (rows * 1.5) / 2);
                    scene.add(mesh);
                    meshes.push(mesh);
                }
            }
            camera.position.set(10, 12, 15);
            activeTimeline = gsap.to(meshes.map(m => m.position), {
                y: 3, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut",
                stagger: { amount: 1.5, grid: [cols, rows], from: "center" }
            });
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function initMatrix() {
            const rows = 10, cols = 10, spheres = [];
            for (let x = 0; x < cols; x++) {
                for (let z = 0; z < rows; z++) {
                    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshNormalMaterial());
                    sphere.position.set(x * 1.2 - (cols * 1.2) / 2, 0, z * 1.2 - (rows * 1.2) / 2);
                    scene.add(sphere);
                    spheres.push(sphere);
                }
            }
            camera.position.set(10, 10, 10);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(spheres.map(s => s.scale), { x: 2, y: 2, z: 2, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
            activeTimeline.to(spheres.map(s => s.position), { y: 1, duration: 1, ease: "sine.inOut", stagger: { amount: 2, grid: [cols, rows], from: "center" } }, 0);
            return { update: () => camera.lookAt(0, 0, 0) };
        }

        function initDrift() {
            const points = [];
            for(let i=0; i<50; i++) {
                const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2), new THREE.MeshNormalMaterial());
                mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                scene.add(mesh);
                points.push(mesh);
            }
            camera.position.set(0, 0, 15);
            return { update: (t) => {
                points.forEach((p, i) => {
                    p.position.y += Math.sin(t + i) * 0.01;
                    p.rotation.x += 0.01;
                });
                camera.lookAt(0,0,0);
            }};
        }

        function initBurst() {
            const spheres = [];
            for(let i=0; i<100; i++) {
                const s = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshNormalMaterial());
                scene.add(s);
                spheres.push(s);
            }
            camera.position.set(0, 0, 10);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(spheres.map(s => s.position), {
                x: () => (Math.random()-0.5)*15,
                y: () => (Math.random()-0.5)*15,
                z: () => (Math.random()-0.5)*15,
                duration: 2,
                stagger: 0.01,
                ease: "power2.out"
            });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initShatter() {
            const group = new THREE.Group();
            const fragments = [];
            for(let i=0; i<27; i++) {
                const f = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshNormalMaterial());
                f.position.set((i%3)-1, Math.floor(i/9)-1, Math.floor((i%9)/3)-1);
                group.add(f);
                fragments.push(f);
            }
            scene.add(group);
            camera.position.set(5, 5, 5);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(fragments.map(f => f.position), {
                x: (i) => f.position.x * 5,
                y: (i) => f.position.y * 5,
                z: (i) => f.position.z * 5,
                duration: 1.5,
                stagger: 0.05,
                ease: "back.in"
            });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initFilling() {
            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 3, 32), new THREE.MeshStandardMaterial({ color: 0x4facfe, transparent: true, opacity: 0.6 }));
            const water = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 3, 32), new THREE.MeshStandardMaterial({ color: 0x00f2fe }));
            water.position.y = -3;
            scene.add(cylinder, water);
            camera.position.set(0, 2, 5);
            activeTimeline = gsap.to(water.position, { y: 0, duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut" });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initTether() {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshNormalMaterial());
            scene.add(sphere);
            camera.position.set(0,0,5);
            activeTimeline = gsap.to(sphere.position, {
                x: 2, y: 2, z: 0, duration: 1, repeat: -1, yoyo: true, ease: "elastic.inOut(1, 0.3)"
            });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initOrbital() {
            const rings = [];
            for(let i=1; i<=3; i++) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(i*2, 0.05, 16, 100), new THREE.MeshBasicMaterial({ color: 0x4facfe }));
                ring.rotation.x = Math.PI/2;
                scene.add(ring);
                rings.push(ring);
            }
            camera.position.set(5, 10, 5);
            return { update: (t) => {
                rings.forEach((r, i) => r.rotation.z += 0.01 * (i+1));
                camera.lookAt(0,0,0);
            }};
        }

        function initPulse() {
            const core = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({ color: 0x4facfe, emissive: 0x4facfe }));
            scene.add(core);
            camera.position.set(0,0,5);
            activeTimeline = gsap.to(core.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 0.8, repeat: -1, yoyo: true, ease: "sine.inOut" });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initUnfold() {
            const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshNormalMaterial());
            scene.add(cube);
            camera.position.set(3,3,3);
            activeTimeline = gsap.to(cube.rotation, { x: Math.PI, duration: 2, repeat: -1, yoyo: true });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initTwist() {
            const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.3, 100, 16), new THREE.MeshNormalMaterial());
            scene.add(torus);
            camera.position.set(0,0,5);
            activeTimeline = gsap.to(torus.rotation, { x: Math.PI*2, y: Math.PI, duration: 4, repeat: -1, ease: "none" });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initVortex() {
            const dots = [];
            for(let i=0; i<200; i++) {
                const d = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                scene.add(d);
                dots.push(d);
            }
            camera.position.set(0, 10, 10);
            return { update: (t) => {
                dots.forEach((d, i) => {
                    const angle = t * 0.5 + i * 0.1;
                    const dist = (i/200) * 5;
                    d.position.set(Math.cos(angle)*dist, - (i/200)*5, Math.sin(angle)*dist);
                });
                camera.lookAt(0,0,0);
            }};
        }

        function initQuantum() {
            const q = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshNormalMaterial());
            scene.add(q);
            camera.position.set(0,0,5);
            activeTimeline = gsap.to(q.position, {
                x: () => (Math.random()-0.5)*4,
                y: () => (Math.random()-0.5)*4,
                z: () => (Math.random()-0.5)*4,
                duration: 0.5, repeat: -1, ease: "power4.inOut"
            });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initRibbon() {
            const spheres = [];
            for(let i=0; i<30; i++) {
                const s = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshNormalMaterial());
                scene.add(s);
                spheres.push(s);
            }
            camera.position.set(0, 5, 10);
            return { update: (t) => {
                spheres.forEach((s, i) => {
                    s.position.x = (i - 15) * 0.4;
                    s.position.y = Math.sin(t * 2 + i * 0.3) * 2;
                    s.position.z = Math.cos(t * 2 + i * 0.3) * 2;
                });
                camera.lookAt(0,0,0);
            }};
        }

        function initCore() {
            const core = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055 }));
            scene.add(core);
            camera.position.set(0,0,5);
            activeTimeline = gsap.to(core.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 0.5, repeat: -1, yoyo: true, ease: "elastic.out(1, 0.3)" });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initGravity() {
            const particles = [];
            for(let i=0; i<100; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: 0x4facfe }));
                p.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                scene.add(p);
                particles.push(p);
            }
            camera.position.set(0,0,15);
            activeTimeline = gsap.to(particles.map(p => p.position), {
                x: 0, y: 0, z: 0, duration: 2, repeat: -1, yoyo: true, ease: "power4.in"
            });
            return { update: () => camera.lookAt(0,0,0) };
        }

        function initPrism() {
            const prisms = [];
            const colors = [0x4facfe, 0x00f2fe, 0xff0055];
            for(let i=0; i<3; i++) {
                const p = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), new THREE.MeshStandardMaterial({ color: colors[i] }));
                p.position.set(0,0,0);
                scene.add(p);
                prisms.push(p);
            }
            camera.position.set(0,0,5);
            activeTimeline = gsap.timeline({ repeat: -1, yoyo: true });
            activeTimeline.to(prisms[0].position, { x: -1, duration: 1 });
            activeTimeline.to(prisms[1].position, { x: 1, duration: 1 }, "<");
            activeTimeline.to(prisms[2].position, { y: 1, duration: 1 }, "<");
            return { update: () => camera.lookAt(0,0,0) };
        }

        function setMode(mode) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');
            
            gsap.to(['#mode-title', '#mode-desc'], { opacity: 0, y: -10, duration: 0.2, onComplete: () => {
                const title = document.getElementById('mode-title');
                const desc = document.getElementById('mode-desc');
                
                const modes = {
                    protein: { t: "Protein Model", d: "Dynamic GSAP Animation Sequencing", fn: initProtein },
                    hover: { t: "Hover Interaction", d: "Algorithm: Elastic Scale + Power2 Rotation", fn: initHover },
                    wave: { t: "Grid Wave", d: "Algorithm: 2D Grid Stagger (From Center)", fn: initWave },
                    matrix: { t: "Sphere Matrix", d: "Algorithm: Radial Pulse & Scale Stagger", fn: initMatrix },
                    drift: { t: "Lattice Drift", d: "Harmonic Oscillation of Icosahedrons", fn: initDrift },
                    burst: { t: "Radial Burst", d: "Center-out Staggered Expansion", fn: initBurst },
                    shatter: { t: "Shatter", d: "Fragmented Geometry Dispersion", fn: initShatter },
                    filling: { t: "Liquid Fill", d: "Linear Volume Interpolation", fn: initFilling },
                    tether: { t: "Elastic Tether", d: "Elastic In-Out Snap Algorithm", fn: initTether },
                    orbital: { t: "Orbital Rings", d: "Concentric Rotation Speeds", fn: initOrbital },
                    pulse: { t: "Neon Pulse", d: "Emissive Scale Synchronization", fn: initPulse },
                    unfold: { t: "Cubic Unfold", d: "Rotationally Driven Expansion", fn: initUnfold },
                    twist: { t: "Torus Twist", d: "Knot-Axis Torque Animation", fn: initTwist },
                    vortex: { t: "Vortex", d: "Spiral Convergence Matrix", fn: initVortex },
                    quantum: { t: "Quantum Leap", d: "Randomized Position Teleportation", fn: initQuantum },
                    ribbon: { t: "Sine Ribbon", d: "Wave-form PathFollowing", fn: initRibbon },
                    core: { t: "Pulsing Core", d: "Elastic Scale-Pulse Center", fn: initCore },
                    gravity: { t: "Gravity Well", d: "Centralized Attraction Vector", fn: initGravity },
                    prism: { t: "Prism Split", d: "Trigonometric Geometry Splitting", fn: initPrism },
                };

                const config = modes[mode];
                title.innerText = config.t;
                desc.innerText = config.d;
                currentContent = config.fn();
                
                gsap.to(['#mode-title', '#mode-desc'], { opacity: 1, y: 0, duration: 0.3 });
            }});

            clearScene();
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            if (currentContent && currentContent.update) currentContent.update(time);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setMode('protein');
        animate();
    </script>
</body>
